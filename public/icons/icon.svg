<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#3498db"/>
  
  <!-- House Shape -->
  <g transform="translate(256, 256)">
    <!-- Roof -->
    <path d="M -120 -40 L 0 -140 L 120 -40 Z" fill="#FF6B6B"/>
    
    <!-- House Body -->
    <rect x="-110" y="-40" width="220" height="180" fill="#ecf0f1" rx="5"/>
    
    <!-- Door -->
    <rect x="-40" y="40" width="80" height="100" fill="#FF6B6B" rx="5"/>
    <circle cx="20" cy="90" r="5" fill="#ffffff"/>
    
    <!-- Windows -->
    <rect x="-90" y="0" width="40" height="40" fill="#3498db" rx="3"/>
    <rect x="50" y="0" width="40" height="40" fill="#3498db" rx="3"/>
    
    <!-- Window Panes -->
    <line x1="-90" y1="20" x2="-50" y2="20" stroke="#ffffff" stroke-width="2"/>
    <line x1="-70" y1="0" x2="-70" y2="40" stroke="#ffffff" stroke-width="2"/>
    <line x1="50" y1="20" x2="90" y2="20" stroke="#ffffff" stroke-width="2"/>
    <line x1="70" y1="0" x2="70" y2="40" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Chimney -->
    <rect x="60" y="-100" width="25" height="60" fill="#2c3e50" rx="2"/>
    
    <!-- Welcome Light (glow effect) -->
    <ellipse cx="0" cy="90" rx="30" ry="15" fill="#FFE66D" opacity="0.6"/>
  </g>
  
  <!-- Text TH at bottom -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle">TH</text>
</svg>
